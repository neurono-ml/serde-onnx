[workspace]
members = ["serde-onnx-macros"]
resolver = "3"

[workspace.package]
edition = "2024"

[package]
name = "serde-onnx"
version = "0.1.0"
edition.workspace = true
description = "Strongly typed Rust data structures for ONNX models, with export and import"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neurono-ml/serde-onnx"
documentation = "https://docs.rs/serde-onnx"
keywords = ["onnx", "machine-learning", "serialization", "inference"]
categories = ["data-structures", "science"]

[features]
default = []
export = ["dep:serde-onnx-macros"]
import = []

[dependencies]
half = "2"
num-traits = "0.2"
prost = "0.14"
serde-onnx-macros = { path = "serde-onnx-macros", version = "0.1.0", optional = true }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
proptest = "1"

[[example]]
name = "sklearn_scaler"
required-features = ["export"]

[[example]]
name = "01_scaler_manual"
required-features = ["export"]

[[example]]
name = "02_scaler_derive"
required-features = ["export"]

[[example]]
name = "03_pipeline_imputer_scaler"
required-features = ["export"]

[[example]]
name = "04_linear_classifier_e2e"
required-features = ["export", "import"]

[[example]]
name = "05_import_inspect"
required-features = ["export", "import"]
