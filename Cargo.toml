[workspace]
members = ["serde-onnx-macros"]
resolver = "3"

[workspace.package]
edition = "2024"

[package]
name = "serde-onnx"
version = "0.1.0"
edition.workspace = true

[features]
default = []
export = ["dep:serde-onnx-macros"]
import = []

[dependencies]
half = "2"
num-traits = "0.2"
prost = "0.14"
serde-onnx-macros = { path = "serde-onnx-macros", version = "0.1.0", optional = true }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
proptest = "1"

[[example]]
name = "sklearn_scaler"
required-features = ["export"]
